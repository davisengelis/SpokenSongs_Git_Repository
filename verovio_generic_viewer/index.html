<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spoken Songs MEI Variant Viewer</title>
  <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #111;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244,244,244,.97);
      border-bottom: 1px solid #ddd;
      padding: 1rem;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      align-items: center;
      margin-bottom: .6rem;
    }
    button, input[type="file"] {
      font: inherit;
    }
    button {
      padding: .45rem .75rem;
      border: 1px solid #aaa;
      border-radius: .4rem;
      background: white;
      cursor: pointer;
    }
    button.active {
      font-weight: 700;
      border-width: 2px;
    }
    button:disabled {
      opacity: .5;
      cursor: default;
    }
    #notation {
      margin: 1rem;
      padding: 1rem;
      background: white;
      overflow-x: auto;
      min-height: 20rem;
    }
    #status {
      font-size: .95rem;
    }
    #meta {
      font-size: .9rem;
      color: #444;
    }
    .spacer {
      flex: 1 1 auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <strong>Spoken Songs MEI Variant Viewer</strong>
      <span class="spacer"></span>
      <input id="file-input" type="file" accept=".mei,.xml,text/xml,application/xml">
    </div>

    <div class="row">
      <span>Reading:</span>
      <span id="witness-buttons"></span>
      <span class="spacer"></span>
      <button id="prev-page" disabled>Previous page</button>
      <button id="next-page" disabled>Next page</button>
    </div>

    <div id="status">Choose a merged MEI file.</div>
    <div id="meta"></div>
  </header>

  <div id="notation"></div>

  <script src="viewer.js"></script>
</body>
</html>
