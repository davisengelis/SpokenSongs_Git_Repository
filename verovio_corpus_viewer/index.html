<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spoken Songs MEI Corpus Viewer</title>
  <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Spoken Songs MEI Corpus Viewer</h1>
      <p class="subtitle">Browse enriched MEI files and switch between &lt;rdg&gt; witnesses.</p>
    </div>
    <div class="load-controls">
      <label class="file-button">
        Choose enriched folder
        <input id="folder-input" type="file" webkitdirectory directory multiple accept=".mei,.xml">
      </label>
      <label class="file-button secondary">
        Or choose MEI files
        <input id="files-input" type="file" multiple accept=".mei,.xml,text/xml,application/xml">
      </label>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="corpus-stats" id="corpus-stats">No corpus loaded.</div>

      <input
        id="search"
        type="search"
        placeholder="Search source, title, filename…"
        autocomplete="off"
        disabled
      >

      <div class="filters">
        <label>
          <input id="variants-only" type="checkbox" disabled>
          Variants only
        </label>
      </div>

      <div id="index-progress" class="progress"></div>
      <div id="song-list" class="song-list"></div>
    </aside>

    <section class="viewer">
      <div class="viewer-toolbar">
        <div>
          <div id="song-heading" class="song-heading">Choose the enriched folder to begin.</div>
          <div id="song-meta" class="song-meta"></div>
        </div>

        <div class="reading-controls">
          <span id="reading-label"></span>
          <span id="witness-buttons"></span>
        </div>

        <div class="page-controls">
          <button id="prev-page" disabled>Previous page</button>
          <span id="page-status"></span>
          <button id="next-page" disabled>Next page</button>
        </div>
      </div>

      <div id="status" class="status">Verovio is loading…</div>
      <div id="notation" class="notation"></div>
    </section>
  </main>

  <script src="viewer.js"></script>
</body>
</html>
